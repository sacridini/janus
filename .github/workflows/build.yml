# Builds Janus on Windows, Linux and macOS, runs the tests and the self-tests and makes the packages
# (tools/package.py): janus-<version>-setup.exe (Inno Setup), janus-<version>-linux-x86_64.tar.xz and
# janus-<version>-macos-arm64.dmg. A tag v<version> publishes them as a GitHub Release. GDAL comes from a
# conda-forge environment, as in a local build (docs/building.md).
name: build

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "site/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # GDAL 3.11, as the local builds: gdal-sys 0.12 has bindings up to 3.11 without bindgen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            packages: gdal=3.11 libgdal-netcdf=3.11 libgdal-hdf5=3.11 numpy
            exe: target/release/janus.exe
          - os: ubuntu-24.04
            packages: gdal=3.11 libgdal-netcdf=3.11 libgdal-hdf5=3.11 numpy pkg-config patchelf
            exe: target/release/janus
          - os: macos-15
            packages: gdal=3.11 libgdal-netcdf=3.11 libgdal-hdf5=3.11 numpy pkg-config
            exe: target/release/janus
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: janus
          create-args: -c conda-forge ${{ matrix.packages }}
          init-shell: bash
          cache-environment: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # gdal-sys: on Windows the import library under the name it links (gdal_i.lib, see
      # .cargo/config.example.toml) and the DLLs on PATH; elsewhere pkg-config, and the environment's libraries
      # found by the programs built (the packages carry their own).
      - name: GDAL for the build
        run: |
          echo "GDAL_VERSION=$(python -c 'from osgeo import gdal; print(gdal.__version__)')" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Windows)
              mkdir -p .cargo/gdal && cp "$CONDA_PREFIX/Library/lib/gdal.lib" .cargo/gdal/gdal_i.lib
              echo "GDAL_LIB_DIR=$PWD/.cargo/gdal" >> "$GITHUB_ENV"
              echo "GDAL_INCLUDE_DIR=$CONDA_PREFIX/Library/include" >> "$GITHUB_ENV"
              echo "$(cygpath -w "$CONDA_PREFIX/Library/bin")" >> "$GITHUB_PATH" ;;
            *)
              echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
              echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib" >> "$GITHUB_ENV" ;;
          esac

      - name: Format and lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      - name: Tests
        run: cargo test --release --workspace --no-fail-fast

      - name: Test data
        run: python tools/make_selftest_data.py "$RUNNER_TEMP/td"

      - name: Self-test (Zeit tools, no window)
        run: ${{ matrix.exe }} --selftest-zeit "$RUNNER_TEMP/td/serie"

      # Monthly Landsat-style bands: CCDC, CODED, NDFI and Tmask, series outputs, the agreement.
      - name: Self-test (multiband Zeit tools, no window)
        run: ${{ matrix.exe }} --selftest-zeit "$RUNNER_TEMP/td/landsat"

      - name: Self-test (embedding kernels and PCA, no window)
        run: ${{ matrix.exe }} --selftest-embeddings

      # Sampling design, strata, sample, project and estimators (against Olofsson et al. 2014).
      - name: Self-test (validation, no window)
        run: ${{ matrix.exe }} --selftest-validation

      # A window needs a GPU: Mesa's software Vulkan (lavapipe) under Xvfb on Linux. The Windows and macOS
      # runners have no usable GPU device, so the UI self-test runs on Linux (and locally everywhere).
      - name: Self-test (UI, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libegl1 libxkbcommon-x11-0
          cd "$RUNNER_TEMP/td"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$GITHUB_WORKSPACE/${{ matrix.exe }}" --selftest-ui A B C D E F G

      - name: Package
        run: python tools/package.py --no-build

      # From another folder, with a relative input: as a user calls it from a terminal.
      - name: Packaged program runs
        run: |
          cd "$RUNNER_TEMP"
          case "$RUNNER_OS" in
            Windows) ;; # the installer is checked by installing it below
            Linux) tar -xJf "$GITHUB_WORKSPACE"/dist/*.tar.xz && env -u LD_LIBRARY_PATH ./janus-*/janus --selftest-zeit td/serie ;;
            macOS) m=$(hdiutil attach -nobrowse -readonly "$GITHUB_WORKSPACE"/dist/*.dmg | tail -1 | awk -F'\t' '{print $NF}')
                   "$m/Janus.app/Contents/MacOS/janus" --selftest-zeit td/serie; rc=$?
                   hdiutil detach "$m"; exit $rc ;;
          esac

      - name: Installer installs and runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\janus-*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\Janus" -Wait
          # without the build environment: only what the installer put there
          $env:PATH = "C:\Windows\system32;C:\Windows"
          & "$env:RUNNER_TEMP\Janus\jn.com" --version   # the command line (a console program)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # janus.exe is a GUI program: & would not wait for it.
          $p = Start-Process "$env:RUNNER_TEMP\Janus\janus.exe" -ArgumentList '--selftest-zeit', 'td\serie' `
                 -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\installed.log"
          Get-Content "$env:RUNNER_TEMP\installed.log" | Select-Object -Last 3
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: janus-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
