[package]
name = "janus-embed"
description = "Janus: foundation-model embeddings (TESSERA, AlphaEarth...): a reduced store of every year, principal components, similarity, change"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gdal.workspace = true
gdal-sys.workspace = true
janus-cube = { path = "../janus-cube" }
janus-gdal = { path = "../janus-gdal" }
rayon = "1.12"
serde_json = "1"
# the warp zeit puts a coarser TESSERA grid through (the same bits)
zeit-core = { git = "https://github.com/sacridini/zeit-cdts", rev = "0bd0919d59f4b889fbf07979ecf5b0f4e80dc666" }
# the AlphaEarth file index (a parquet file): rows read without Arrow
parquet = { version = "57", default-features = false, features = ["snap"] }
