[package]
name = "janus-app"
description = "Janus: raster time series and data cubes, explored and analysed (the interface, egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "janus"
path = "src/main.rs"

# the console launcher (the C++'s jn.com)
[[bin]]
name = "jn"
path = "src/bin/jn.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_plot = "0.37"
gdal.workspace = true
gdal-sys.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
janus-cache = { path = "../janus-cache" }
janus-cube = { path = "../janus-cube" }
janus-geo = { path = "../janus-geo" }
janus-zeit = { path = "../janus-zeit" }
janus-gpu = { path = "../janus-gpu" }
janus-session = { path = "../janus-session" }
mimalloc = { version = "0.1", default-features = false }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
