[package]
name = "janus-cube"
description = "Janus: a series of rasters as a cube (layers, dates, reading through GDAL)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gdal.workspace = true
gdal-sys.workspace = true
janus-gdal = { path = "../janus-gdal" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde_json = "1"
