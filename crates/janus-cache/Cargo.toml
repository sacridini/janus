[package]
name = "janus-cache"
description = "Janus: the cube at reduced resolution (overview) and its disk cache, in the C++'s formats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = "1"
gdal.workspace = true
gdal-sys.workspace = true
janus-cube = { path = "../janus-cube" }
janus-gdal = { path = "../janus-gdal" }
# the full-resolution cache's blocks compressed with a context kept by each thread
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
