[package]
name = "janus-zeit"
description = "Janus: Zeit's tools in the process (zeit-core), as the Python bridge ran them: descriptors, pixel and raster runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gdal.workspace = true
gdal-sys.workspace = true
janus-cube = { path = "../janus-cube" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Zeit 2.0.0 (its core is Rust only) with remotePARTS's methods (ar_reml, gls, spatial, parts); the bridge's
# fixtures were recorded on 2.0.0 (58e1b1e), whose algorithms this revision leaves as they were
zeit-core = { git = "https://github.com/sacridini/zeit-cdts", rev = "679e9874df78449268312ba0dc084cb6af4e4dd7" }
