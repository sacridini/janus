[package]
name = "janus-zeit"
description = "Janus: Zeit's tools in the process (zeit-core), as the Python bridge ran them: descriptors, pixel and raster runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gdal.workspace = true
gdal-sys.workspace = true
janus-cube = { path = "../janus-cube" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Zeit 2.0.0 (its core is Rust only) with remotePARTS's methods (ar_reml, gls, spatial, parts) and the recovery
# metrics (recovery), and NNLS's step fixed for a spectrum equal to an endmember (NaN before); the bridge's
# fixtures were recorded on 2.0.0 (58e1b1e), whose other results this revision leaves as they were
zeit-core = { git = "https://github.com/sacridini/zeit-cdts", rev = "926e9125faf9caa372067c8752db0e374957bd2d" }
