<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="opcao-E-espectro-interferometria-bars-l" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4296FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="opcao-E-espectro-interferometria-bars-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(0, 0)">
    <!-- Background Frame -->
    <rect x="25" y="25" width="150" height="150" rx="16" fill="#15161A" stroke="#262A31" stroke-width="1.5"/>
    
    <!-- Central Date Marker Line -->
    <line x1="100" y1="30" x2="100" y2="170" stroke="#F29A38" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Stepped Horizontal Series Bars (Left = Past History, Right = Future/Change) -->
    <!-- Heights and widths mimicking real NDVI / harmonic curves -->
    <!-- Row 1 -->
    <rect x="76" y="38" width="20" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="38" width="20" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 2 -->
    <rect x="62" y="48" width="34" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="48" width="38" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 3 -->
    <rect x="48" y="58" width="48" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="58" width="56" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 4 -->
    <rect x="40" y="68" width="56" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="68" width="64" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 5 - Major Peak -->
    <rect x="34" y="78" width="62" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="78" width="68" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 6 -->
    <rect x="42" y="88" width="54" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="88" width="54" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 7 - Center Transition -->
    <rect x="52" y="98" width="44" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="98" width="42" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 8 -->
    <rect x="64" y="108" width="32" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="108" width="30" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 9 -->
    <rect x="50" y="118" width="46" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="118" width="50" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 10 - Secondary Peak -->
    <rect x="36" y="128" width="60" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="128" width="62" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 11 -->
    <rect x="46" y="138" width="50" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="138" width="48" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 12 -->
    <rect x="68" y="148" width="28" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="148" width="32" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    <!-- Row 13 -->
    <rect x="78" y="158" width="18" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-l)"/>
    <rect x="104" y="158" width="18" height="6" rx="2" fill="url(#opcao-E-espectro-interferometria-bars-r)"/>
    
    <!-- Central Cursor Reticle -->
    <circle cx="100" cy="100" r="5" fill="#F29A38"/>
    <circle cx="100" cy="100" r="2" fill="#FFFFFF"/>
  </g>
</svg>
