<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="03-portal-laminas-temporais-slice-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="03-portal-laminas-temporais-slice-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4296FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="03-portal-laminas-temporais-slice-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4296FA"/>
    </linearGradient>
  </defs>

  <!-- Roman Ianua (Archway Portal) built of Isometric Raster Time-Slices -->
  <!-- Layer 1: Deep Past (Back Layer) -->
  <path d="M 44 160 L 44 92 C 44 60, 156 60, 156 92 L 156 160" 
        fill="none" stroke="#1E3A8A" stroke-width="5" opacity="0.4"/>

  <!-- Layer 2: Mid Past (Offset Layer) -->
  <path d="M 54 160 L 54 94 C 54 68, 146 68, 146 94 L 146 160" 
        fill="none" stroke="#4296FA" stroke-width="4.5" opacity="0.7"/>

  <!-- Layer 3: Present Front Portal Frame -->
  <path d="M 64 160 L 64 96 C 64 76, 136 76, 136 96 L 136 160" 
        fill="none" stroke="#00F2FE" stroke-width="4"/>

  <!-- Bottom Baseline / Ground Line of the Temple of Janus -->
  <line x1="30" y1="160" x2="170" y2="160" stroke="#6AADFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Isometric Pixel Slices flanking the gateway (The Data Cube Slices) -->
  <!-- Left Side: Past Stacks -->
  <polygon points="36,110 52,100 52,120 36,130" fill="#4296FA" opacity="0.5"/>
  <polygon points="36,136 52,126 52,146 36,156" fill="#1E3A8A" opacity="0.6"/>

  <!-- Right Side: Future Stacks -->
  <polygon points="148,100 164,110 164,130 148,120" fill="#00F2FE" opacity="0.5"/>
  <polygon points="148,126 164,136 164,156 148,146" fill="#4296FA" opacity="0.6"/>

  <!-- The Portal Opening forms the Cosmic Eye Looking Through Time -->
  <!-- Eye Almond nested inside the archway -->
  <path d="M 64 105 C 80 85, 120 85, 136 105 C 120 125, 80 125, 64 105 Z" 
        fill="#0B111E" stroke="#6AADFF" stroke-width="2"/>

  <!-- Iris & Focal Sensor -->
  <circle cx="100" cy="105" r="16" fill="#162447" stroke="#00F2FE" stroke-width="2"/>
  <circle cx="100" cy="105" r="7" fill="#F29A38"/>
  <circle cx="100" cy="105" r="2.5" fill="#FFFFFF"/>

  <!-- Laser Keystone / Time Cursor dividing the portal entrance -->
  <line x1="100" y1="36" x2="100" y2="84" stroke="#F29A38" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="36" r="4" fill="#F29A38"/>
</svg>