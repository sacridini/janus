<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="05-diafragma-bitemporal-blade-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#4296FA"/>
    </linearGradient>
    <linearGradient id="05-diafragma-bitemporal-blade-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#6AADFF"/>
    </linearGradient>
  </defs>

  <!-- Outer Camera / Satellite Sensor Housing -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#2A3B5C" stroke-width="3"/>
  <circle cx="100" cy="100" r="76" fill="#0B111E" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Dual Opposite Aperture Blades (Janus Rotation: Past Clockwise, Future Counter-Clockwise) -->
  <!-- Left Wing Blades (Past) -->
  <path d="M 100 24 L 62 52 L 78 96 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-l)" opacity="0.85"/>
  <path d="M 62 52 L 32 94 L 70 124 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-l)" opacity="0.75"/>
  <path d="M 32 94 L 48 144 L 88 142 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-l)" opacity="0.65"/>
  <path d="M 48 144 L 100 176 L 100 134 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-l)" opacity="0.8"/>

  <!-- Right Wing Blades (Future) -->
  <path d="M 100 24 L 138 52 L 122 96 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-r)" opacity="0.85"/>
  <path d="M 138 52 L 168 94 L 130 124 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-r)" opacity="0.75"/>
  <path d="M 168 94 L 152 144 L 112 142 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-r)" opacity="0.65"/>
  <path d="M 152 144 L 100 176 L 100 134 L 100 100 Z" fill="url(#05-diafragma-bitemporal-blade-r)" opacity="0.8"/>

  <!-- Center Anamorphic Eye Aperture created by the blades -->
  <ellipse cx="100" cy="100" rx="30" ry="18" fill="#0B111E" stroke="#00F2FE" stroke-width="2.5"/>
  
  <!-- Temporal Scan Line / Sensor Slit -->
  <line x1="72" y1="100" x2="128" y2="100" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- The Orange Focal Sensor ("Now") -->
  <circle cx="100" cy="100" r="10" fill="#F29A38"/>
  <circle cx="100" cy="100" r="4" fill="#FFFFFF"/>

  <!-- Calibrated tick marks on the sensor perimeter -->
  <line x1="100" y1="18" x2="100" y2="28" stroke="#F29A38" stroke-width="3"/>
  <line x1="100" y1="172" x2="100" y2="182" stroke="#F29A38" stroke-width="3"/>
  <line x1="18" y1="100" x2="28" y2="100" stroke="#6AADFF" stroke-width="2"/>
  <line x1="172" y1="100" x2="182" y2="100" stroke="#00F2FE" stroke-width="2"/>
</svg>