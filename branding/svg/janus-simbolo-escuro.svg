<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Janus</title><g id="simbolo">
  <defs>
    <linearGradient id="s-escuro-pass" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="s-escuro-fut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4296FA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Contornos do Olho -->
  <path d="M 100, 48 C 65, 48 35, 75 22, 100 C 35, 125 65, 152 100, 152" fill="none" stroke="url(#s-escuro-pass)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 100, 48 C 135, 48 165, 75 178, 100 C 165, 125 135, 152 100, 152" fill="none" stroke="url(#s-escuro-fut)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Íris Esquerda (Passado) -->
  <path d="M 100, 64 A 36,36 0 0,0 100, 136 Z" fill="url(#s-escuro-pass)"/>
  <path d="M 100, 76 A 24,24 0 0,0 100, 124 Z" fill="#0F172A"/>
  <!-- Íris Direita (Futuro) -->
  <path d="M 100, 64 A 36,36 0 0,1 100, 136 Z" fill="url(#s-escuro-fut)"/>
  <path d="M 100, 76 A 24,24 0 0,1 100, 124 Z" fill="#1E293B"/>
  <!-- Meridianos e Setas -->
  <line x1="100" y1="34" x2="100" y2="48" stroke="#F29A38" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="152" x2="100" y2="166" stroke="#F29A38" stroke-width="3" stroke-linecap="round"/>
  <path d="M 20, 100 L 30, 93 L 30, 107 Z" fill="#1D4ED8"/>
  <path d="M 180, 100 L 170, 93 L 170, 107 Z" fill="#0284C7"/>
  <!-- Sensor Central -->
  <circle cx="100" cy="100" r="10" fill="#F29A38"/>
  <circle cx="100" cy="100" r="4" fill="#FFFFFF"/>
</g></svg>
