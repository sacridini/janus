<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Janus</title>
  <defs>
    <linearGradient id="ico-sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162447"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </linearGradient>
  </defs>
  <!-- Background Tile -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#ico-sq-bg)"/>
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Centered Symbol (Scale 0.85) -->
  <g transform="translate(15, 15) scale(0.85)">
    <g id="simbolo">
  <defs>
    <linearGradient id="ico-sq-s-pass" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4296FA"/>
      <stop offset="100%" stop-color="#2F6FE0"/>
    </linearGradient>
    <linearGradient id="ico-sq-s-fut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6AADFF"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
  </defs>
  <!-- Contornos do Olho -->
  <path d="M 100, 48 C 65, 48 35, 75 22, 100 C 35, 125 65, 152 100, 152" fill="none" stroke="url(#ico-sq-s-pass)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 100, 48 C 135, 48 165, 75 178, 100 C 165, 125 135, 152 100, 152" fill="none" stroke="url(#ico-sq-s-fut)" stroke-width="7" stroke-linecap="round"/>
  <!-- Íris Esquerda (Passado) -->
  <path d="M 100, 64 A 36,36 0 0,0 100, 136 Z" fill="url(#ico-sq-s-pass)"/>
  <path d="M 100, 76 A 24,24 0 0,0 100, 124 Z" fill="#1D3B6B"/>
  <!-- Íris Direita (Futuro) -->
  <path d="M 100, 64 A 36,36 0 0,1 100, 136 Z" fill="url(#ico-sq-s-fut)"/>
  <path d="M 100, 76 A 24,24 0 0,1 100, 124 Z" fill="#144A63"/>
  <!-- Meridianos e Setas -->
  <line x1="100" y1="32" x2="100" y2="46" stroke="#F29A38" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="154" x2="100" y2="168" stroke="#F29A38" stroke-width="5" stroke-linecap="round"/>
  <path d="M 16, 100 L 31, 90 L 31, 110 Z" fill="#4296FA"/>
  <path d="M 184, 100 L 169, 90 L 169, 110 Z" fill="#00F2FE"/>
  <!-- Sensor Central -->
  <circle cx="100" cy="100" r="10" fill="#F29A38"/>
  <circle cx="100" cy="100" r="4" fill="#FFFFFF"/>
</g>
  </g>
</svg>