# Janus in Rust, beside the C++ in src/ until the cut (RUST_MIGRATION.md).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.40.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
gdal = "0.19"
gdal-sys = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1

# Debug builds usable with real cubes.
[profile.dev.package."*"]
opt-level = 3
